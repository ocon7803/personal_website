<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Alex Rivera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">alexrivera<span class="dot">.dev</span></a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">home</a></li>
        <li><a href="projects.html">projects</a></li>
        <li><a href="resume.html">resume</a></li>
        <li><a href="contact.html" aria-current="page">contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="hero" style="padding-bottom: 30px;">
    <div class="wrap">
      <p class="eyebrow">Contact</p>
      <h1 class="hero-name" style="font-size: clamp(28px, 4vw, 40px);">Let's talk</h1>
      <p class="hero-role">The fastest way to reach me is email. Also find me at the links below.</p>
    </div>
  </section>

  <section class="block" style="border-bottom: none;">
    <div class="wrap">
      <div class="contact-grid">
        <a class="contact-card" href="mailto:you@example.com">
          <span class="label">Email</span>
          <span class="value">you@example.com</span>
        </a>
        <a class="contact-card" href="https://github.com/yourusername" target="_blank" rel="noopener">
          <span class="label">GitHub</span>
          <span class="value">@yourusername</span>
        </a>
        <a class="contact-card" href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener">
          <span class="label">LinkedIn</span>
          <span class="value">/in/yourusername</span>
        </a>
        <a class="contact-card" href="https://yourdomain.com" target="_blank" rel="noopener">
          <span class="label">Location</span>
          <span class="value">Denver, CO</span>
        </a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="footer-note">© 2026 Alex Rivera</span>
    <span class="footer-note">built with plain HTML/CSS</span>
  </div>
</footer>

</body>
</html>
